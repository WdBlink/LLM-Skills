version: 1
skills:
  - name: good-benchmarks
    display_name: Good Benchmarks
    name_zh: Benchmark 设计与审计
    category: Knowledge
    version: 0.2.0
    license: MIT
    path: skills/good-benchmarks
    description: Design and audit benchmarks by selecting task forms and success criteria, binding data and scoring artifacts, and checking solvability, verifier validity and fair comparisons.
    tagline_en: Choose benchmark forms and success criteria, then deliver reusable data, scoring and validation.
    tagline_zh: 按场景选择 benchmark 形态与成功依据，交付可复用数据和评分器，验证可解性与比较公平性。
  - name: thinking-in-bets
    display_name: Thinking in Bets
    name_zh: 对赌决策工作流
    category: Knowledge
    version: 0.1.0
    license: Proprietary
    path: skills/thinking-in-bets
    description: Apply evidence-grounded workflows for decisions under uncertainty, belief updates, outcome reviews, dissent, future planning and precommitment.
    tagline_en: Turn uncertainty into actionable choices and learning with 35 tools and seven workflows.
    tagline_zh: 从《对赌》提炼35个工具与七条工作流，按情境自动辅助选择、信念校准、复盘和风险规划。
  - name: experience-distill
    display_name: Experience Distill
    name_zh: 任务经验提炼
    category: Knowledge
    version: 0.1.0
    license: MIT
    path: skills/experience-distill
    description: Distill task histories into evidence-backed lessons with applicability boundaries, counterexamples and focused handoff notes.
    tagline_en: Turn task experience into actionable lessons with evidence and limits.
    tagline_zh: 从任务经历提炼有证据、有边界、可供下次任务复用的经验。
  - name: workflow-skill-creator
    display_name: Workflow Skill Creator
    name_zh: 工作流 Skill 创作
    category: Knowledge
    version: 0.2.0
    license: MIT
    path: skills/workflow-skill-creator
    description: Create or refactor skills by reusing tools and saved scripts, parameterizing task differences, and handing structured judgments to the current host with explicit validation, recovery and quality checks.
    tagline_en: Build reusable skills with scripts first, host judgment as needed, and verified task quality and cost.
    tagline_zh: 固化重复操作、参数化任务差异，按需由当前宿主判断，并验证交付质量与实际成本。
  - name: pv-forecast-pptx
    display_name: PV Forecast PPTX
    name_zh: 光伏预测汇报 PPTX
    category: Presentation
    version: 0.1.0
    license: Proprietary
    path: skills/air-pptx
    description: Create professional PowerPoint research presentations for photovoltaic and energy forecasting projects using a bundled reference template and presentation resources.
    tagline_en: Build photovoltaic forecasting research presentation decks from bundled templates.
    tagline_zh: 基于模板资源生成光伏与能源预测研究汇报 PPTX。
  - name: template-writing
    display_name: Template Writing
    name_zh: 模板写作
    category: Knowledge
    version: 0.1.0
    license: Proprietary
    path: skills/template-writing
    description: Draft and fill strict-format DOCX templates from reference materials such as technical proposals, contracts, technical agreements, test protocols, meeting notes, and project documents.
    tagline_en: Draft strict-format DOCX templates from project reference materials.
    tagline_zh: 根据合同、技术协议和项目资料撰写并填充固定格式 DOCX 模板。
  - name: transcript-source-compiler
    display_name: Transcript Source Compiler
    name_zh: 转写来源编译器
    category: Knowledge
    version: 0.1.0
    license: MIT
    path: skills/transcript-source-compiler
    description: Convert long-form speech or sharing-session transcripts into evidence-backed LLM-Wiki source records plus one or more readable articles.
    tagline_en: Turn messy speech transcripts into auditable source records and readable articles.
    tagline_zh: 将大段演讲转写编译成可追溯的来源底稿和可读文章。
  - name: daily-todo-planner
    display_name: Daily Todo Planner
    name_zh: 每日待办计划器
    category: Knowledge
    version: 0.1.0
    license: Proprietary
    path: skills/daily-todo-planner
    description: Generate daily task plans from long free-form descriptions, classify work with the Eisenhower matrix, estimate and schedule time blocks, learn from execution reviews, and pre-research research-heavy tasks.
    tagline_en: Turn messy daily briefs into time-blocked plans with local learning and research prefetch.
    tagline_zh: 将杂乱每日描述转成可复盘学习、可提前预研的时间块计划。
  - name: mind-map
    display_name: Mind Map
    name_zh: 项目思维导图
    category: Knowledge
    version: 0.2.13
    license: MIT
    path: skills/mind-map
    description: Record explicit project thinking into Obsidian Markdown nodes, project directory anchors, compact judgment/rule schema indexes, graph-neutral provenance and timeline logs, an interactive HTML mind map, and an AI context pack.
    tagline_en: Preserve project judgments as Obsidian nodes, compact schema indexes, graph-neutral timeline/provenance, and an interactive HTML map.
    tagline_zh: 将项目判断记录为 Obsidian 双链节点、紧凑 schema 索引、图谱中性的时间线/溯源和可交互 HTML 图谱。
  - name: auto-yolo-dataset
    display_name: Auto YOLO Dataset
    name_zh: 自动 YOLO 数据集
    category: Multimodal
    version: 0.1.0
    license: Proprietary
    path: skills/auto-yolo-dataset
    description: Generate object-detection annotations and portable dataset assets from images through an explicit local or remote detector backend.
    tagline_en: Build YOLO, COCO, VOC, and Label Studio assets through a configured detector.
    tagline_zh: 通过本地或远程检测器生成 YOLO、COCO、VOC 和 Label Studio 数据集资产。
  - name: ms-qwen-vl
    display_name: MS Qwen VL
    name_zh: 魔搭 Qwen-VL 视觉解析
    category: Multimodal
    version: 0.1.0
    license: MIT
    path: skills/ms-qwen-vl
    description: Use ModelScope or SiliconFlow Qwen-VL compatible APIs to analyze images and videos, including description, OCR, visual QA, detection, charts, and YOLO dataset output.
    tagline_en: Analyze images and videos with Qwen-VL, then optionally export YOLO datasets.
    tagline_zh: 用 Qwen-VL 解析图片/视频，并可输出 YOLO 数据集。
  - name: weekly-report
    display_name: Weekly Report
    name_zh: 中文周报生成器
    category: Knowledge
    version: 0.1.0
    license: Proprietary
    path: skills/weekly-report
    description: Generate Chinese weekly work report DOCX files from recent work logs or a provided log file using a portable self-contained script.
    tagline_en: Generate Chinese weekly report DOCX files from work logs.
    tagline_zh: 从工作日志生成可迁移的中文工作周报 DOCX。
  - name: karpathy-autoresearch-adapter
    display_name: Karpathy Autoresearch Adapter
    name_zh: Karpathy 自动研究适配器
    category: Knowledge
    version: 0.1.0
    license: MIT
    path: skills/karpathy-autoresearch-adapter
    description: Adapt an existing GitHub project into a Karpathy-style autoresearch protocol project by scanning for a real evaluator, producing a plan first, and applying only after user confirmation.
    tagline_en: Turn existing repositories into evaluator-first autoresearch protocol projects.
    tagline_zh: 将现有仓库改造成以真实评价器为核心的自动研究协议项目。
  - name: social-cover-maker
    display_name: Social Cover Maker
    name_zh: 社交平台封面生成器
    category: Multimodal
    version: 0.1.0
    license: MIT
    path: skills/social-cover-maker
    description: Generate social media cover images for WeChat, Xiaohongshu, Zhihu, and other publishing platforms from Markdown articles or notes using Open Design systems and deterministic SVG-to-PNG rendering.
    tagline_en: Generate platform-ready article covers with Open Design styles and verified SVG/PNG exports.
    tagline_zh: 基于 Open Design 风格系统为公众号、小红书、知乎等平台生成可校验的 SVG/PNG 封面。
  - name: paper-deconstruction
    display_name: Paper Deconstruction
    name_zh: 论文精读
    category: Knowledge
    version: 0.1.0
    license: MIT
    path: skills/paper-deconstruction
    description: Distill ML/CV/NLP papers into visual, evidence-backed deep-read notes using a five-stage method (structure, story, deconstruct, evaluate, visualize) built around the ViLT paper-reading lecture.
    tagline_en: Distill a paper into a visual deep-read note with a five-stage story-plus-engineering method.
    tagline_zh: 用结构-故事-拆解-评价-视觉化五阶法把一篇论文精读成带配图的可视化笔记。
  - name: glm-ocr-pdf2md
    display_name: GLM-OCR PDF to Markdown
    name_zh: 本地GLM-OCR扫描PDF转Markdown
    category: Multimodal
    version: 0.1.0
    license: MIT
    path: skills/glm-ocr-pdf2md
    description: Convert a scanned or no-text-layer PDF book into a structured Markdown file with faithful layout, auto-detected table of contents, and explicit page-marker anchors, by running every page through a locally-served ZhipuAI/GLM-OCR model (0.9B vision-language OCR). No external API; the model is loaded once via Hugging Face transformers on Apple Silicon (MPS) or CUDA.
    tagline_en: Local ZhipuAI/GLM-OCR turns scanned PDFs into page-anchored Markdown books.
    tagline_zh: 本地ZhipuAI/GLM-OCR将扫描版PDF转为带目录和页码标记的Markdown书籍。
  - name: academic-writing-storytelling
    display_name: Academic Writing Storytelling Framework
    name_zh: 学术写作讲故事框架
    category: Knowledge
    version: 0.1.0
    license: MIT
    path: skills/academic-writing-storytelling
    description: A distilled topic framework for using storytelling techniques in academic writing, synthesized from four distinct schools: Timothy G. Pollock's dramatic-structure school (Freytag's pyramid mapped to IMRaD), the writing-craft school (Zinsser / Lamott / King / Leonard on clutter, brevity, second drafts), the narrative-turn school (Czarniawska / Boje on stories as legitimate knowledge form), and the science-rhetoric school (Fahnestock on epistemic-warrant calibration, Hilgartner on selective appropriation). Produces a 6-model cognitive toolkit, 12 if-then heuristics, a 12-step workflow, and surfaces (not resolves) inter-school tensions. Use when writing or reviewing academic papers, especially empirical social-science research, qualitative studies, and ESL authors.
    tagline_en: Four-school synthesis: story as scaffold, story as honesty, story as knowledge, story as calibrated rhetoric.
    tagline_zh: 学术写作讲故事的四派综合框架——把"讲故事"拆成6个可操作心智模型与12步工作流。
  - name: annie-duke-perspective
    display_name: Annie Duke Perspective
    name_zh: Annie Duke 对赌思维
    category: Knowledge
    version: 0.2.0
    license: MIT
    path: skills/annie-duke-perspective
    description: Distilled decision-making framework and voice distilled from Annie Duke's Thinking in Bets (《对赌》中信版 2026). Provides 7 mental models (Resulting, All Decisions Are Bets, Skill+Luck, Belief Gullibility, Mental Time Travel, Merton CUDOS group decisions, Accountable Predictions), 11 if-then heuristics, a 7-dimension expression DNA with required anchors and forbidden tokens, and an agentic boot sequence for adopting Annie's probabilistic, story-anchored voice. Use to evaluate decision quality vs result quality, force probabilistic narration, run pre-mortems and backcasting, design accountable predictions with time-window follow-ups, and stress-test team decisions for CUDOS violations. Do not use for pure academic Q&A, deterministic math, or technical tool selection where Resulting does not apply.
    tagline_en: Think in bets: separate decision quality from result quality, with probabilities and pre-mortems.
    tagline_zh: 用 Annie Duke 的对赌思维做决策顾问——把决策质量与结果质量分开，强制概率式叙述与责任性预测。
